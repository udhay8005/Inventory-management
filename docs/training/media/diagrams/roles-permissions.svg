<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Roles and permissions">
  <rect x="30" y="20" width="580" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="320" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Who can do what &#8212; roles &amp; permissions</text>
  <rect x="30" y="92" width="190" height="200" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="125" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Manager</text>
  <line x1="50" y1="138" x2="200" y2="138" stroke="#16a34a" stroke-width="1"/>
  <text x="125" y="170" text-anchor="middle" font-size="13" fill="#166534">Everything</text>
  <text x="125" y="192" text-anchor="middle" font-size="12" fill="#166534">full access to all</text>
  <text x="125" y="210" text-anchor="middle" font-size="12" fill="#166534">screens and actions</text>
  <text x="125" y="244" text-anchor="middle" font-size="12" fill="#166534">accepts / rejects</text>
  <text x="125" y="262" text-anchor="middle" font-size="12" fill="#166534">audits</text>
  <rect x="240" y="92" width="190" height="200" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="335" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Store Keeper</text>
  <line x1="260" y1="138" x2="410" y2="138" stroke="#2563eb" stroke-width="1"/>
  <text x="262" y="162" text-anchor="start" font-size="12" fill="#1e40af">&#10003; receive</text>
  <text x="262" y="184" text-anchor="start" font-size="12" fill="#1e40af">&#10003; issue</text>
  <text x="262" y="206" text-anchor="start" font-size="12" fill="#1e40af">&#10003; submit audit</text>
  <text x="262" y="228" text-anchor="start" font-size="12" fill="#1e40af">&#10003; file damage</text>
  <text x="262" y="250" text-anchor="start" font-size="12" fill="#1e40af">&#10003; manage catalog</text>
  <rect x="450" y="92" width="190" height="200" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="545" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#134e4a">Read-only viewer</text>
  <line x1="470" y1="138" x2="620" y2="138" stroke="#0d9488" stroke-width="1"/>
  <text x="545" y="180" text-anchor="middle" font-size="13" fill="#115e59">View reports only</text>
  <text x="545" y="208" text-anchor="middle" font-size="12" fill="#115e59">can look, cannot</text>
  <text x="545" y="226" text-anchor="middle" font-size="12" fill="#115e59">change anything</text>
</svg>
