<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 412" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Forecast and reorder flow">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect x="30" y="20" width="300" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="180" y="48" text-anchor="middle" font-size="15" font-weight="600" fill="#14532d">Movement history</text>
  <text x="180" y="68" text-anchor="middle" font-size="12" fill="#166534">past receipts &amp; issues</text>
  <line x1="180" y1="84" x2="180" y2="116" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="30" y="116" width="300" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="144" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">AI forecast</text>
  <text x="180" y="164" text-anchor="middle" font-size="12" fill="#1e40af">Holt-Winters / SES, retrained daily</text>
  <line x1="180" y1="180" x2="180" y2="212" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="30" y="212" width="300" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="240" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">Reorder suggestion</text>
  <text x="180" y="260" text-anchor="middle" font-size="12" fill="#1e40af">how much + by when</text>
  <line x1="180" y1="276" x2="180" y2="308" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="30" y="308" width="300" height="64" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="180" y="336" text-anchor="middle" font-size="15" font-weight="600" fill="#134e4a">Low-stock / Dead-stock reports</text>
