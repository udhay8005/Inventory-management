<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 508" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Damage and repair flow">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect x="30" y="20" width="300" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="180" y="48" text-anchor="middle" font-size="15" font-weight="600" fill="#14532d">Damage filed</text>
  <text x="180" y="68" text-anchor="middle" font-size="12" fill="#166534">photo + slot recorded</text>
  <line x1="180" y1="84" x2="180" y2="116" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="30" y="116" width="300" height="64" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="180" y="144" text-anchor="middle" font-size="15" font-weight="600" fill="#713f12">Recommended action</text>
  <text x="180" y="164" text-anchor="middle" font-size="12" fill="#854d0e">Repair / Urgent buy</text>
  <line x1="330" y1="148" x2="392" y2="148" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="392" y="116" width="118" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="451" y="142" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">Scrap</text>
  <text x="451" y="160" text-anchor="middle" font-size="11" fill="#991b1b">if beyond repair</text>
  <line x1="180" y1="180" x2="180" y2="212" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="30" y="212" width="300" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="240" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">Repair Order</text>
  <text x="180" y="260" text-anchor="middle" font-size="12" fill="#1e40af">raised for the damaged item</text>
  <line x1="180" y1="276" x2="180" y2="308" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="30" y="308" width="300" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="336" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">Inspect -&gt; Repair -&gt; Mark Done</text>
  <text x="180" y="356" text-anchor="middle" font-size="12" fill="#1e40af">work through the repair stages</text>
  <line x1="180" y1="372" x2="180" y2="404" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="30" y="404" width="300" height="64" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="180" y="432" text-anchor="middle" font-size="15" font-weight="600" fill="#134e4a">Return to stock</text>
  <text x="180" y="452" text-anchor="middle" font-size="12" fill="#115e59">item back in its slot</text>
</svg>
