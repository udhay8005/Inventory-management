<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="FIFO versus FEFO">
  <rect x="30" y="20" width="460" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="260" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">FIFO vs FEFO &#8212; which item leaves first?</text>
  <rect x="30" y="92" width="220" height="140" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">FIFO</text>
  <text x="140" y="144" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">First In First Out</text>
  <text x="140" y="178" text-anchor="middle" font-size="12" fill="#1e40af">oldest in-date</text>
  <text x="140" y="196" text-anchor="middle" font-size="12" fill="#1e40af">leaves first</text>
  <text x="140" y="216" text-anchor="middle" font-size="12" fill="#1e40af">ordinary stock</text>
  <rect x="270" y="92" width="220" height="140" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="380" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">FEFO</text>
  <text x="380" y="144" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">First Expiry First Out</text>
  <text x="380" y="172" text-anchor="middle" font-size="12" fill="#991b1b">soonest-expiry leaves first</text>
  <text x="380" y="192" text-anchor="middle" font-size="12" fill="#991b1b">medicine, feed, fluid, pooja,</text>
  <text x="380" y="210" text-anchor="middle" font-size="12" fill="#991b1b">or any item with an expiry</text>
</svg>
