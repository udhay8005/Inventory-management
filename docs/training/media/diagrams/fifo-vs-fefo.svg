<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="FIFO at issue, and the Expiry Alerts report for rotation">
  <rect x="30" y="20" width="460" height="48" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="260" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">How stock leaves &#8212; and how expiry is managed</text>
  <rect x="30" y="92" width="220" height="140" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">At issue: FIFO</text>
  <text x="140" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">First In, First Out</text>
  <text x="140" y="168" text-anchor="middle" font-size="12" fill="#1e40af">oldest in-date leaves first</text>
  <text x="140" y="186" text-anchor="middle" font-size="12" fill="#1e40af">every product, every issue</text>
  <text x="140" y="212" text-anchor="middle" font-size="11" fill="#1e40af">(no expiry-sort at the picker)</text>
  <rect x="270" y="92" width="220" height="140" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="380" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12">Manage expiry</text>
  <text x="380" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#854d0e">Expiry Alerts report</text>
  <text x="380" y="164" text-anchor="middle" font-size="12" fill="#854d0e">flags soonest-to-expire</text>
  <text x="380" y="182" text-anchor="middle" font-size="12" fill="#854d0e">red / amber / blue</text>
  <text x="380" y="206" text-anchor="middle" font-size="12" fill="#854d0e">you rotate perishables</text>
</svg>
