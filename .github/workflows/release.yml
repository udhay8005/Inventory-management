name: Release

# Single source of truth = the pushed git tag.
#
# Pushing a production release tag (e.g. `v19.0.10.0.0`) publishes a GitHub
# Release for THAT exact tag, with an auto-generated changelog of the commits
# since the previous tag. Module-manifest `version` bumps NO LONGER create
# releases — only deliberately-pushed release tags do. This keeps the GitHub
# "Releases" page an accurate mirror of the production release line and stops
# the highest module version (e.g. wms_location 19.0.3.6.0) from masquerading
# as the latest release.
#
#   Cut a release:  git tag -a v19.0.11.0.0 -m "..." && git push origin v19.0.11.0.0

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+.[0-9]+"   # v19.0.<X>.<Y>.<Z> release tags only

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build changelog from the previous tag
        id: changelog
        run: |
          tag="${GITHUB_REF_NAME}"
          prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || echo "")
          if [ -n "$prev" ]; then range="${prev}..${tag}"; else range="${tag}"; fi
          {
            echo "body<<__RELEASE_EOF__"
            echo "## Changes in ${tag}${prev:+ (since ${prev})}"
            echo ""
            git log "$range" --no-merges --pretty=format:"- %s (%h)"
            echo ""
            echo ""
            echo "_Full closure matrix: docs/REMEDIATION-CLOSURE.md_"
            echo "__RELEASE_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: WMS ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          make_latest: "true"
          draft: false
          prerelease: false
