name: Release

# Cuts a GitHub release whenever the version bumps on main.
# Requires the lead commit to update one of the module manifests'
# `version` keys; the workflow detects the change and tags accordingly.

on:
  push:
    branches: [main]
    paths:
      - "addons/**/__manifest__.py"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect manifest version
        id: ver
        run: |
          # Pick the highest version across all addons — simplest policy.
          ver=$(grep -h -oE '"19\.0\.[0-9]+\.[0-9]+\.[0-9]+"' addons/*/__manifest__.py \
                | tr -d '"' | sort -V | tail -1)
          if [[ -z "$ver" ]]; then
            echo "No 19.0.x version found in any manifest."
            exit 0
          fi
          echo "version=v${ver}" >> $GITHUB_OUTPUT

      - name: Skip if tag already exists
        id: skip
        run: |
          if git rev-parse "${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.ver.outputs.version }} already exists."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        if: steps.skip.outputs.skip == 'false'
        id: changelog
        run: |
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -z "$last_tag" ]]; then
            range=""
          else
            range="${last_tag}..HEAD"
          fi
          changelog=$(git log $range --pretty=format:"- %s (%h)" --no-merges)
          # GitHub Actions multi-line output
          {
            echo "body<<EOF"
            echo "## Changes since ${last_tag:-initial}"
            echo ""
            echo "$changelog"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create release
        if: steps.skip.outputs.skip == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: WMS ${{ steps.ver.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
