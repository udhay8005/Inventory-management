name: CI

# Triggers
#   - Push to main or test branches.
#   - Any PR targeting main or test.
#   - Manual via `workflow_dispatch`.
# Workflow: push code to `test` → CI runs → if green, PR to `main` → merge.
# Concurrency: cancel an in-flight run if a newer commit lands on the same ref.
#
# Native (no Docker) build — mirrors the local Windows setup: PostgreSQL +
# Python venv + Odoo source clone. We run on Ubuntu because GitHub Actions
# Linux runners are faster and cheaper than Windows runners; the WMS code
# itself is platform-agnostic.

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Versions are hardcoded below rather than using top-level `env:` because
# GitHub Actions' `services:` block does not support the `env` context
# (the postgres:16 image tag has to be a literal). Keep these in sync:
#   Odoo: 19.0   |   Python: 3.12   |   PostgreSQL: 16

jobs:
  # -------------------------------------------------------------------------
  # 1) Lint — fast, no DB, no Odoo. Fails the PR before we spin up Postgres.
  # -------------------------------------------------------------------------
  lint:
    name: Lint & static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: pip

      - name: Install lint deps
        # Pin EXACTLY — drift between '24.*' and a specific 24.x release
        # changes formatting expectations and breaks CI parity with local
        # `make lint`. Keep these in sync with .pre-commit-config.yaml.
        run: |
          python -m pip install --upgrade pip
          pip install \
            flake8==7.1.1 \
            black==24.10.0 \
            isort==5.13.2 \
            pylint==3.3.1 \
            pylint-odoo==9.3.4 \
            bandit==1.7.10

      - name: Show pinned versions
        run: |
          black --version
          isort --version-number
          flake8 --version
          bandit --version

      - name: Black format check (Python)
        run: black --check --diff --color addons/ scripts/ ai_worker/

      - name: isort import order
        run: isort --check-only --diff addons/ scripts/ ai_worker/

      - name: Flake8 (style + obvious errors)
        # Config is in `.flake8` at the repo root — passing CLI flags here
        # OVERRIDES the config (passing --extend-ignore on the CLI replaces
        # the file's value rather than merging). Stay silent and let the
        # config drive, so local lint matches CI exactly.
        run: flake8 addons/

      - name: Pylint-Odoo (manifest + Odoo conventions)
        run: |
          # Pylint-Odoo only validates files inside addons/; skip if no addons.
          pylint --load-plugins=pylint_odoo \
                 --disable=all \
                 --enable=odoolint \
                 --output-format=colorized \
                 addons/ \
                 || true   # treat as warnings for now; tighten later

      - name: XML well-formedness
        run: |
          # Validates every .xml in addons/ parses cleanly (catches broken
          # views, missing tags, unescaped ampersands).
          set -e
          find addons -name '*.xml' -print0 | while IFS= read -r -d '' f; do
            python -c "import xml.etree.ElementTree as ET; ET.parse('$f')" \
              || { echo "❌ XML parse error in $f"; exit 1; }
          done
          echo "✔ All XML files parse cleanly."

      - name: PowerShell syntax check (scripts/*.ps1)
        # PowerShell 7 (pwsh, preinstalled on ubuntu runners) parses the
        # PS 5.1-compatible scripts fine for syntax purposes.
        shell: pwsh
        run: |
          $bad = @()
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $t=$null;$e=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$t,[ref]$e)|Out-Null
            if ($e) { $bad += "$($_.Name): $($e[0].Message)" } }
          if ($bad) { $bad | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host "All PowerShell scripts in scripts/ parse cleanly."

  # -------------------------------------------------------------------------
  # 2) Security scan — bandit (Python) + pip-audit (deps).
  # -------------------------------------------------------------------------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: pip

      - name: Install
        run: pip install bandit==1.7.10 pip-audit==2.7.3

      - name: Bandit (code-level CVEs)
        run: |
          # -ll = low+, skip test files. Emits SARIF for the Security tab.
          bandit -r addons/ -ll --format json --output bandit-report.json
          bandit -r addons/ -ll

      - name: pip-audit (dependency CVEs)
        run: pip-audit -r requirements.txt --strict

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
          retention-days: 30

  # -------------------------------------------------------------------------
  # 3) Odoo test run — native install on the Ubuntu runner. Mirrors the
  #    install-native.ps1 layout: PostgreSQL service + Python venv + Odoo
  #    source clone.
  # -------------------------------------------------------------------------
  odoo_tests:
    name: Odoo 19.0 module tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      # GitHub's PostgreSQL service container — equivalent to the Windows
      # postgresql-x64-16 service the local install uses.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo_ci_password
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: pip

      - name: System packages required by Odoo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              postgresql-client \
              wkhtmltopdf \
              libldap2-dev libsasl2-dev \
              fonts-dejavu-core
          # wkhtmltopdf in Ubuntu repos isn't the patched-Qt build Odoo prefers
          # for PDF reports, but it's fine for module-test purposes (we don't
          # test PDF generation here).

      - name: Grant odoo role CREATEDB
        run: |
          PGPASSWORD=odoo_ci_password psql -h localhost -U odoo -d postgres \
              -c "ALTER ROLE odoo WITH CREATEDB;"

      - name: Clone Odoo 19.0 source
        run: |
          git clone --depth 1 -b 19.0 \
              https://github.com/odoo/odoo.git $HOME/odoo

      - name: Install Odoo + project Python deps
        run: |
          python -m venv $HOME/venv
          $HOME/venv/bin/pip install --upgrade pip setuptools wheel
          $HOME/venv/bin/pip install -r $HOME/odoo/requirements.txt
          $HOME/venv/bin/pip install -r requirements.txt

      - name: Create CI database
        run: |
          PGPASSWORD=odoo_ci_password createdb -h localhost -U odoo wms_ci

      - name: Run WMS module tests
        shell: bash
        run: |
          set +e
          $HOME/venv/bin/python $HOME/odoo/odoo-bin \
              --stop-after-init \
              -d wms_ci \
              --db_host=localhost --db_port=5432 \
              --db_user=odoo --db_password=odoo_ci_password \
              --addons-path=$HOME/odoo/addons,$GITHUB_WORKSPACE/addons \
              -i wms_location,wms_fifo,wms_barcode,wms_repair_damage,wms_ai_forecast,wms_reports,wms_training \
              --without-demo=all \
              --test-enable \
              --test-tags wms,wms_audit,wms_delete,wms_health \
              --log-level=info \
              --logfile=/dev/stdout \
              2>&1 | tee odoo_test.log
          rc=${PIPESTATUS[0]}
          echo "=== odoo-bin exit code: $rc ==="
          echo "log size: $(wc -c < odoo_test.log) bytes"

          # Publish the log to the step summary so failures are visible
          # without needing an auth token to fetch the artifact.
          {
            echo "## odoo_tests step output"
            echo ''
            echo '```'
            tail -c 60000 odoo_test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$rc" -ne 0 ]; then
            echo "::error::odoo-bin exited with $rc"
            exit "$rc"
          fi
          if grep -qE "ERROR wms_ci odoo\.tests\.result:.*(failed|error)" odoo_test.log; then
            echo "::error::WMS test failures detected"
            exit 1
          fi
          if ! grep -qE "odoo\.addons\.wms_.*tests" odoo_test.log; then
            echo "::error::No WMS tests ran — check @tagged('wms') decorators."
            exit 1
          fi
          echo "✔ WMS test suite passed."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odoo-test-log-19.0
          path: odoo_test.log
          retention-days: 14

  # -------------------------------------------------------------------------
  # 4) Native smoke — start Odoo, hit /web/login, confirm HTTP 200/303.
  #    Lighter than the old docker compose smoke; same intent.
  # -------------------------------------------------------------------------
  native_smoke:
    name: Native smoke
    runs-on: ubuntu-latest
    needs: [lint, odoo_tests]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo_ci_password
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: pip

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              postgresql-client wkhtmltopdf libldap2-dev libsasl2-dev fonts-dejavu-core

      - name: Grant CREATEDB
        run: |
          PGPASSWORD=odoo_ci_password psql -h localhost -U odoo -d postgres \
              -c "ALTER ROLE odoo WITH CREATEDB;"

      - name: Clone Odoo + install deps
        run: |
          git clone --depth 1 -b 19.0 https://github.com/odoo/odoo.git $HOME/odoo
          python -m venv $HOME/venv
          $HOME/venv/bin/pip install --upgrade pip setuptools wheel
          $HOME/venv/bin/pip install -r $HOME/odoo/requirements.txt
          $HOME/venv/bin/pip install -r requirements.txt

      - name: Init wms_smoke DB
        run: |
          PGPASSWORD=odoo_ci_password createdb -h localhost -U odoo wms_smoke

      - name: Start Odoo in the background
        run: |
          $HOME/venv/bin/python $HOME/odoo/odoo-bin \
              -d wms_smoke \
              --db_host=localhost --db_port=5432 \
              --db_user=odoo --db_password=odoo_ci_password \
              --addons-path=$HOME/odoo/addons,$GITHUB_WORKSPACE/addons \
              --without-demo=all \
              -i wms_location \
              --http-port=8069 \
              --logfile=/dev/stdout &
          echo $! > odoo.pid

      - name: Wait for Odoo to answer
        run: |
          for i in {1..40}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8069/web/login || true)
            if [ "$code" = "200" ] || [ "$code" = "303" ]; then
              echo "✔ Odoo responding on :8069 (HTTP $code)"
              exit 0
            fi
            sleep 3
          done
          echo "❌ Odoo did not respond within 120 s"
          exit 1

      - name: Stop Odoo
        if: always()
        run: |
          if [ -f odoo.pid ]; then kill $(cat odoo.pid) || true; fi

  # -------------------------------------------------------------------------
  # 5) Status summary — single required check for branch protection.
  # -------------------------------------------------------------------------
  ci_status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [lint, security, odoo_tests, native_smoke]
    if: always()
    steps:
      - name: Aggregate status
        run: |
          if [[ "${{ needs.lint.result }}" != "success" \
             || "${{ needs.security.result }}" != "success" \
             || "${{ needs.odoo_tests.result }}" != "success" \
             || "${{ needs.native_smoke.result }}" != "success" ]]; then
            echo "❌ One or more required jobs failed."
            exit 1
          fi
          echo "✔ All required jobs passed."
