name: Bug report
description: Something doesn't work as expected
labels: ["bug", "triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A short, factual summary.
    validations: { required: true }

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      placeholder: |
        1. Log in as ...
        2. Go to WMS → ...
        3. Click ...
        4. Observe ...
    validations: { required: true }

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations: { required: true }

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Odoo version: 19.0
        - Branch / release: (main / v20 / v19.0.46.0.0 / ...)
        - PostgreSQL version:
        - Python version:
        - OS / browser:
        - Module touched (if known): (wms_location / wms_fifo / wms_barcode / wms_repair_damage / wms_ai_forecast / wms_reports / wms_training / wms_perishable)
    validations: { required: false }

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Tail of `.runtime\logs\odoo.log` around the error
        (e.g. `Get-Content .runtime\logs\odoo.log -Tail 100`).
        Paste only the relevant section. Redact secrets.
      render: shell
