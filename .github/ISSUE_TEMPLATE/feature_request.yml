name: Feature request
description: A new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem you're trying to solve
      description: |
        Skip "wouldn't it be nice if…" — describe the *current* friction.
    validations: { required: true }

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations: { required: true }

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations: { required: false }

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: ["nice to have", "would help workflow", "blocking ops"]
      default: 0
