# Inventory_mngt — Odoo CE 19 + PostgreSQL 16 + optional AI worker
# All services connect on the same private bridge network.
# Persistent data lives in named volumes; addons are bind-mounted for dev.

services:
  db:
    image: postgres:16-alpine
    container_name: wms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${DB_USER:-odoo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-odoo}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-odoo}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [wms_net]

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    image: wms/odoo:19
    container_name: wms_odoo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: ${DB_USER:-odoo}
      PASSWORD: ${DB_PASSWORD:-odoo}
      ODOO_ADMIN_PASSWD: ${ODOO_ADMIN_PASSWD:-admin_change_me}
    volumes:
      - ./addons:/mnt/extra-addons:rw
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo_data:/var/lib/odoo
      - odoo_logs:/var/log/odoo
    ports:
      - "${ODOO_PORT:-8069}:8069"
      - "${ODOO_LONGPOLL_PORT:-8072}:8072"
    networks: [wms_net]
    command: >
      odoo
      --config=/etc/odoo/odoo.conf
      --db_host=db
      --db_user=${DB_USER:-odoo}
      --db_password=${DB_PASSWORD:-odoo}
      --logfile=/var/log/odoo/odoo.log

  # Cloudflare Tunnel — gives the WMS a permanent HTTPS URL reachable from
  # any phone on mobile data, without opening ports on your router.
  #
  # Two run modes (pick one):
  #
  #  A. QUICK tunnel — random *.trycloudflare.com URL, no account needed.
  #     Good for demos. URL changes each restart.
  #     Bring up with:    docker compose --profile tunnel up -d cloudflared_quick
  #     Find the URL in:  docker compose logs cloudflared_quick
  #
  #  B. NAMED tunnel — fixed URL on your own domain (e.g. wms.example.com).
  #     Requires a free Cloudflare account + creating a tunnel + token.
  #     Set CLOUDFLARE_TUNNEL_TOKEN in .env then:
  #         docker compose --profile tunnel up -d cloudflared_named
  cloudflared_quick:
    image: cloudflare/cloudflared:latest
    container_name: wms_cf_quick
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://odoo:8069
    depends_on: [odoo]
    networks: [wms_net]
    profiles: ["tunnel"]

  cloudflared_named:
    image: cloudflare/cloudflared:latest
    container_name: wms_cf_named
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [odoo]
    networks: [wms_net]
    profiles: ["tunnel-named"]

  # Optional out-of-process AI worker — only enable on small VPS / Pi when
  # in-process cron isn't enough. Trains forecasts and writes back via XML-RPC.
  ai_worker:
    build:
      context: ./ai_worker
      dockerfile: Dockerfile
    image: wms/ai_worker:1.0
    container_name: wms_ai_worker
    restart: unless-stopped
    depends_on:
      - odoo
    environment:
      ODOO_URL: http://odoo:8069
      ODOO_DB: ${ODOO_DB:-wms}
      ODOO_USER: ${ODOO_USER:-admin}
      ODOO_PASSWORD: ${ODOO_USER_PASSWORD:-admin}
      FORECAST_INTERVAL_HOURS: ${FORECAST_INTERVAL_HOURS:-6}
    networks: [wms_net]
    profiles: ["ai"]   # docker compose --profile ai up

volumes:
  db_data:
  odoo_data:
  odoo_logs:

networks:
  wms_net:
    driver: bridge
