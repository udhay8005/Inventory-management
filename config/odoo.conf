[options]
; db_host / db_user / db_password are passed on the command line by
; docker-compose. admin_passwd is the master password for the DB manager —
; change it in production.
admin_passwd = local_master_pw

addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo

; workers=0 → threaded single-process server. WebSocket/longpolling shares
; the HTTP port (8069), so the browser doesn't need a separate proxy hop.
; In production behind nginx, raise workers and configure /websocket routing.
workers = 0
max_cron_threads = 2

; Memory limits (apply per worker; with workers=0 they apply to the main proc)
limit_memory_hard = 2147483648
limit_memory_soft = 1610612736
limit_time_cpu = 600
limit_time_real = 1200

; proxy_mode is only useful when there's a real reverse proxy in front;
; leaving it on without one breaks WebSocket origin checks for some clients.
proxy_mode = False
without_demo = False

log_level = info
log_handler = :INFO
logfile = /var/log/odoo/odoo.log
