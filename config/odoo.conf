[options]
admin_passwd = ${ODOO_ADMIN_PASSWD}
db_host = db
db_port = 5432
db_user = ${USER}
db_password = ${PASSWORD}

addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo

; Use multiprocessing in prod; workers=0 in dev for hot reload via dev-mode.
workers = 2
max_cron_threads = 2
longpolling_port = 8072

; Limit AI cron memory footprint
limit_memory_hard = 1610612736
limit_memory_soft = 1342177280
limit_time_cpu = 600
limit_time_real = 1200

; Performance
proxy_mode = True
without_demo = False

; Logging — file is also captured by container stdout for `docker logs`
log_level = info
log_handler = :INFO
logfile = /var/log/odoo/odoo.log
